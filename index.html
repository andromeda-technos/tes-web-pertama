<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Integrasi Web ke Sheets</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
      <h2 class="text-2xl font-bold mb-6 text-slate-800">
        Kirim Pesan ke Sheets
      </h2>

      <!-- Form Input -->
      <form id="formPesan" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Nama</label>
          <input
            type="text"
            id="nama"
            required
            class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Pesan</label>
          <textarea
            id="pesan"
            required
            class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500"
          ></textarea>
        </div>
        <button
          type="submit"
          id="btnSubmit"
          class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition"
        >
          Kirim Data
        </button>
      </form>

      <!-- Tempat nampilin notifikasi sukses/gagal -->
      <p
        id="notifikasi"
        class="mt-4 text-center text-sm font-semibold hidden"
      ></p>
    </div>

    <script>
      // MASUKIN URL WEB APP GAS LU DI SINI
      const gasURL = "URL_WEB_APP_GAS_LU_YANG_PANJANG_ITU";

      const form = document.getElementById("formPesan");
      const btnSubmit = document.getElementById("btnSubmit");
      const notifikasi = document.getElementById("notifikasi");

      form.addEventListener("submit", function (e) {
        e.preventDefault(); // Mencegah web reload saat tombol diklik

        // Ubah teks tombol biar user tau lagi proses
        btnSubmit.innerText = "Mengirim...";
        btnSubmit.disabled = true;

        // Ambil data dari inputan form
        const dataYangDikirim = {
          nama: document.getElementById("nama").value,
          pesan: document.getElementById("pesan").value,
        };

        // Proses pengiriman data ke Google Sheets via Fetch API (Si Pelayan)
        fetch(gasURL, {
          method: "POST",
          // Trik rahasia: pakai text/plain biar gak kena blokir keamanan CORS browser
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(dataYangDikirim),
        })
          .then((response) => response.json())
          .then((data) => {
            // Kalau sukses
            notifikasi.innerText = data.pesan;
            notifikasi.classList.remove("hidden", "text-red-600");
            notifikasi.classList.add("text-green-600");
            form.reset(); // Kosongin form
          })
          .catch((error) => {
            // Kalau gagal
            notifikasi.innerText = "Gagal mengirim data!";
            notifikasi.classList.remove("hidden", "text-green-600");
            notifikasi.classList.add("text-red-600");
          })
          .finally(() => {
            // Balikin tombol seperti semula
            btnSubmit.innerText = "Kirim Data";
            btnSubmit.disabled = false;
          });
      });
    </script>
  </body>
</html>
